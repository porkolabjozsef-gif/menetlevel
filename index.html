<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><title>Menetlevél kitöltő</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#00205f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef0f5;--card:#fff;--ink:#14213d;--mut:#5b6478;--line:#d3d8e4;--acc:#00205f;--on:#fff;--red:#bc0033;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f38;--ink:#e8ecf8;--mut:#9aa5c0;--line:#2b3555;--acc:#8aa6ff;--on:#0e1424}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f38;--ink:#e8ecf8;--mut:#9aa5c0;--line:#2b3555;--acc:#8aa6ff;--on:#0e1424}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;background:var(--card);border-bottom:3px solid var(--red)}
header img{height:38px;border-radius:2px}
header h1{font-size:1.1rem;margin:0}header small{color:var(--mut);font-weight:400;margin-left:.3rem}
main{max-width:46rem;margin:0 auto;padding:.8rem}
details{background:var(--card);border:1px solid var(--line);border-radius:6px;margin:0 0 .6rem}
summary{padding:.75rem .9rem;font-weight:600;cursor:pointer}
.r{padding:.5rem .9rem .7rem;border-top:1px solid var(--line)}
.r>b{display:block;font-size:.85rem;color:var(--mut);margin-bottom:.3rem}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.5rem}
.f label{font-size:.78rem;color:var(--mut);display:block}
input{width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tp{display:flex;gap:.4rem;align-items:flex-end}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.6rem 0}
button{font:inherit;font-weight:600;padding:.65rem 1.1rem;border-radius:5px;border:1px solid var(--acc);background:var(--acc);color:var(--on);cursor:pointer}
button.s{background:transparent;color:var(--acc)}
button.x{padding:.2rem .6rem;font-size:.8rem;margin-left:.5rem}
button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
#sv{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;-webkit-overflow-scrolling:touch;margin-bottom:.8rem}
#sv svg{display:block;height:auto;margin-bottom:.4rem}
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:rgba(0,32,95,.10)}.hit.sel{fill:rgba(188,0,51,.16);stroke:#bc0033;stroke-width:3}
#ed{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:3px solid var(--acc);box-shadow:0 -4px 16px rgba(0,0,0,.3);padding:.6rem .9rem calc(.7rem + env(safe-area-inset-bottom,0px))}
.edh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.4rem}
.edn{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}.edn button{flex:1 1 auto}
body.ed-open{padding-bottom:230px}
#ed label{font-size:.8rem;color:var(--mut);display:block}
.strip{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:.6rem;padding:.55rem .9rem;background:var(--acc);color:var(--on);font-size:.9rem;font-weight:600;border-radius:0 0 8px 8px}
.strip a{color:inherit;white-space:nowrap}
details.step{background:none;border:0}details.step>summary{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:.5rem;font-size:1.05rem}
.sh{font-size:1.05rem;margin:1.1rem .2rem .5rem}
.fab{position:sticky;bottom:.6rem;display:flex;justify-content:center;padding:.3rem 0;z-index:1}
.fab button{padding:.8rem 1.8rem;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.tabs{position:sticky;top:0;z-index:2;display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0;background:var(--bg)}
.tabs button{flex:none;background:var(--card);color:var(--ink);border-color:var(--line);padding:.5rem .9rem}
.tabs button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.gh{background:var(--card);border:1px solid var(--line);border-radius:6px;margin:0 0 .7rem;padding-bottom:.2rem}
.gh h2{font-size:1rem;margin:0;padding:.7rem .9rem}
details.mo{margin:.5rem 0 0;border:0;background:none}details.mo summary{padding:.3rem 0;font-weight:500;font-size:.9rem;color:var(--acc)}
input:disabled{background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px);opacity:.8}
.tp input{min-width:0}.tp .x{margin:0;flex:none}
.pv{padding:.5rem;overflow-x:auto}.pv svg{margin-bottom:.5rem}.pv svg{width:100%;min-width:40rem;height:auto;background:#fff;border:1px solid var(--line)}
#sheet{display:none}
@media print{
 @page{size:A4 landscape;margin:6mm}
 :root{padding:0}body{background:#fff}
 body>*:not(#sheet){display:none!important}
 #sheet{display:block}#sheet svg{display:block;width:285mm;height:auto}#sheet svg+svg{break-before:page}
}
</style></head><body>
